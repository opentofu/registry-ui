name: Index (manual)
run-name: Reindex ${{ inputs.content_type }} ${{ inputs.namespace }} ${{ inputs.name }} ${{ inputs.target_system }}
permissions: {}
on:
  workflow_dispatch:
    inputs:
      content_type:
        description: "Content to reindex"
        required: true
        type: choice
        default: both
        options:
          - both
          - provider
          - module
      namespace:
        description: "Namespace, e.g. hashicorp (provider) or terraform-aws-modules (module)"
        required: true
        type: string
      name:
        description: "Name only, e.g. aws (provider) or vpc (module); empty reindexes the namespace"
        required: false
        type: string
        default: ""
      target_system:
        description: "Module target system, e.g. aws in terraform-aws-modules/vpc/aws; requires module content and a name"
        required: false
        type: string
        default: ""
      force_repo_data_update:
        type: boolean
        required: false
        default: false
        description: "Also refresh GitHub repository metadata"
concurrency:
  group: index
  cancel-in-progress: false
jobs:
  generate:
    name: Run generation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Cache tofu binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./backend/internal/moduleindex/moduleschema/testtofu
          key: tofu-binary
      - name: Build tofu
        run:
          go generate ./...
      - name: Update documentation
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_ENDPOINT_URL_S3: ${{secrets.AWS_ENDPOINT_URL_S3}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          S3_BUCKET: ${{secrets.S3_BUCKET}}
          CONTENT_TYPE: ${{inputs.content_type}}
          NAMESPACE: ${{inputs.namespace}}
          NAME: ${{inputs.name}}
          TARGET_SYSTEM: ${{inputs.target_system}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          FORCE_REPO_DATA_UPDATE: ${{inputs.force_repo_data_update}}
        run: |
          if [[ -n "${TARGET_SYSTEM}" && -z "${NAME}" ]]; then
            echo "::error::A target system requires a module name."
            exit 1
          fi
          if [[ -n "${TARGET_SYSTEM}" && "${CONTENT_TYPE}" != "module" ]]; then
            echo "::error::A target system requires module content."
            exit 1
          fi

          force_target="${NAMESPACE}"
          if [[ -n "${NAME}" ]]; then
            force_target+="/${NAME}"
          fi
          if [[ -n "${TARGET_SYSTEM}" ]]; then
            force_target+="/${TARGET_SYSTEM}"
          fi

          scope_args=()
          case "${CONTENT_TYPE}" in
            provider) scope_args+=(--skip-update-modules) ;;
            module) scope_args+=(--skip-update-providers) ;;
          esac

          repo_data_args=()
          if [[ "${FORCE_REPO_DATA_UPDATE}" == "true" ]]; then
            repo_data_args+=(--force-repodata-update)
          fi

          go run github.com/opentofu/registry-ui/cmd/generate \
            --log-level=trace \
            --s3-bucket="${S3_BUCKET}" \
            --blocklist ../blocklist.json \
            --namespace="${NAMESPACE}" \
            --name="${NAME}" \
            --target-system="${TARGET_SYSTEM}" \
            --force-regenerate="${force_target}" \
            "${scope_args[@]}" \
            "${repo_data_args[@]}"
      - name: Update search index
        working-directory: search/pg-indexer
        env:
          PG_CONNECTION_STRING: ${{secrets.PG_CONNECTION_STRING}}
        run: go run ./
